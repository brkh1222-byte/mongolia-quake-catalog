# South-Hangay 1-D model of Dashdondog et al. (2020), PMAS 60(2), Table 1 (p. 8):
# layer-top depth (km, negative = above sea level), Vp, Vs (km/s). Used as a
# location sensitivity test (src/locate.py --vmodel ... --suffix _dd2020).
velocity_model:
  kind: grid
  layers:
    - {depth: -5.0, vp: 6.06, vs: 3.50}
    - {depth: 14.0, vp: 6.16, vs: 3.50}
    - {depth: 20.0, vp: 6.27, vs: 3.63}
    - {depth: 25.0, vp: 6.36, vs: 3.68}
    - {depth: 30.0, vp: 6.53, vs: 3.79}
    - {depth: 35.0, vp: 6.63, vs: 3.91}
    - {depth: 45.0, vp: 7.16, vs: 4.18}
    - {depth: 50.0, vp: 8.00, vs: 4.62}
